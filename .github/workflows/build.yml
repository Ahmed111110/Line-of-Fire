name: Build Line of Fire APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Keystore & Export Presets
        run: |
          mkdir -p ~/.android ~/.config/godot build
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          cat << EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_password = "android"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          EOF

          cat << EOF > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/LineOfFire.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/release=""
          custom_template/debug=""
          gradle_build/use_gradle_build=false
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86_64=false
          architectures/x86=false
          package/unique_name="com.abosuleiman.lineoffire"
          package/name="Line of Fire"
          version/code=1
          version/name="0.1.0"
          screen/orientation=0
          xr_features/xr_mode=0
          permissions/internet=false
          EOF

      - name: Export Android APK
        run: |
          godot --headless --export-debug "Android" build/LineOfFire.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Line-of-Fire-APK
          path: build/LineOfFire.apk
