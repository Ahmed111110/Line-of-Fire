name: Build Line of Fire APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java & Android SDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jdk unzip curl

          mkdir -p ~/android-sdk/cmdline-tools ~/.android
          curl -fSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d ~/android-sdk/cmdline-tools
          mv ~/android-sdk/cmdline-tools/cmdline-tools ~/android-sdk/cmdline-tools/latest
          rm -f cmdline-tools.zip

          yes | ~/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses
          ~/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "build-tools;34.0.0"

          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Godot 4.3 Standard & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          curl -fSL -o godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          rm -f godot.zip

          curl -fSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          unzip -q templates.tpz -d extracted_templates
          find extracted_templates -type f -name "android_*.apk" -exec cp {} ~/.local/share/godot/export_templates/4.3.stable/ \;
          rm -rf templates.tpz extracted_templates

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_password = "android"
          export/android/android_sdk_path = "$HOME/android-sdk"
          EOF

      - name: Create Android export presets
        run: |
          cat << EOF > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/LineOfFire.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/release=""
          custom_template/debug=""
          gradle_build/use_gradle_build=false
          keystore/debug="$HOME/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          architectures/x86_64=false
          architectures/x86=false
          package/unique_name="com.abosuleiman.lineoffire"
          package/name="Line of Fire"
          version/code=1
          version/name="0.1.0"
          screen/orientation=0
          xr_features/xr_mode=0
          permissions/internet=false
          EOF

      - name: Create build directory
        run: mkdir -p build

      - name: Export Android APK
        run: godot --headless --export-debug "Android" build/LineOfFire.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Line-of-Fire-APK
          path: build/LineOfFire.apk
